services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aida-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      Database__AutoMigrate: "true"
      Redis__Enabled: "true"
      Redis__ConnectionString: redis:6379
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # OpenTelemetry → Jaeger (in-memory spans; UI on localhost:16686)
      OpenTelemetry__Endpoint: http://jaeger:4318/v1/traces
    ports:
      - "8080:8080"

  postgres:
    image: docker.io/pgvector/pgvector:pg17
    container_name: aida-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - aida-postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/redis:7-alpine
    container_name: aida-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - aida-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: docker.io/jaegertracing/jaeger:2.23.0
    container_name: aida-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"   # UI  → http://localhost:16686
      - "127.0.0.1:4318:4318"     # OTLP/HTTP for local `dotnet run`

volumes:
  aida-postgresql:
    external: true
  aida-redis:

# NOTE: the redis service block used to be nested UNDER `volumes:` (YAML
# indentation) — it was parsed as a volume definition, so compose could never
# start. It is a proper service again, below the services above.

