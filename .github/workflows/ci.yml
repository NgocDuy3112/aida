name: CI

on:
  push:
  pull_request:

# A PR branch would otherwise run twice, once for the push and once for the pull request.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Pinned: ubuntu-latest (26.04 "resolute") ships libleptonica6 (liblept.so.6),
    # while the prod image (mcr aspnet:10.0 = noble) ships liblept.so.5. CI must test
    # the same Tesseract stack the Dockerfile deploys.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The OCR integration test (Trait Integration=Ocr, gated by AIDA_OCR_IT=1) needs
      # the distro Tesseract 5 libraries plus the vie/eng models.
      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-vie tesseract-ocr-eng
          tesseract --list-langs

      - name: Restore
        run: dotnet restore aida.slnx

      - name: Build
        run: dotnet build aida.slnx -c Debug --no-restore

      # The Tesseract 5.2.0 NuGet interop asks the loader for the Windows-style names
      # (libtesseract50.so, libleptonica-1.82.0.so, libdl.so); alias the distro sonames
      # next to the test assembly, exactly as scripts/ocr-it.sh does.
      - name: Link Tesseract native libraries
        run: ./scripts/link-tesseract-libs.sh tests/aida.Tests/bin/Debug/net10.0

      - name: Test
        env:
          AIDA_OCR_IT: "1"
        run: dotnet test aida.slnx -c Debug --no-build --logger "console;verbosity=normal"
